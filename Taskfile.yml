version: '3'

vars:
  PROJECT_NAME: cursor-cli-agent

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies
    cmds:
      - bun install

  dev:
    desc: Run in development mode with watch
    cmds:
      - bun run dev

  build:
    desc: Build the project
    cmds:
      - bun run build

  start:
    desc: Run the application
    cmds:
      - bun run start

  test:
    desc: Run tests with Bun
    cmds:
      - bun run test

  test-watch:
    desc: Run tests in watch mode with Bun
    cmds:
      - bun run test:watch

  test-verbose:
    desc: Run tests with verbose output
    cmds:
      - scripts/run-src-tests.sh --verbose

  typecheck:
    desc: Run TypeScript type checking
    cmds:
      - bun run typecheck

  fmt:
    desc: Format code with prettier
    cmds:
      - bun run format

  fmt-check:
    desc: Check code formatting
    cmds:
      - bun run format:check

  lint:
    desc: Run all lints (Biome + format check + typecheck)
    cmds:
      - biome check . --diagnostic-level=warn
      - task: fmt-check
      - task: typecheck

  gitleaks:
    desc: Scan staged changes for secrets before commit
    cmds:
      - gitleaks git --pre-commit --redact --staged --verbose

  install-git-hooks:
    desc: Install the Nix-managed pre-commit hook configuration
    cmds:
      - nix develop -c pre-commit install --install-hooks

  clean:
    desc: Clean build artifacts
    cmds:
      - bun run clean

  ci:
    desc: Run all CI checks
    cmds:
      - biome check . --diagnostic-level=warn
      - task: fmt-check
      - task: typecheck
      - task: test
      - task: build

  checkout-divedra:
    desc: Initialize the divedra submodule without overwriting local submodule work
    cmds:
      - |
        if [ -e divedra/.git ] && [ -d .git/modules/divedra ]; then
          exit 0
        fi
        git submodule update --init divedra

  divedra:
    desc: Run divedra from the local submodule (pass args after --)
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- {{.CLI_ARGS}}

  divedra-workflows:
    desc: List project-local divedra workflows from .divedra/workflows
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow list

  divedra-design-loop-validate:
    desc: Validate the design-and-implement review workflow bundle
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow validate design-and-implement-review-loop

  divedra-design-implement:
    desc: Run the design-and-implement workflow from the project catalog (pass workflow args after --)
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow run design-and-implement-review-loop {{.CLI_ARGS}}

  divedra-recent-change-validate:
    desc: Validate the recent-change quality workflow bundle
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow validate recent-change-quality-loop

  divedra-parity-backlog-validate:
    desc: Validate the parity backlog design-and-implement workflow bundle
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow validate parity-backlog-design-implement-loop

  divedra-parity-backlog:
    desc: Run the parity backlog design-and-implement workflow from the project catalog (pass workflow args after --)
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow run parity-backlog-design-implement-loop {{.CLI_ARGS}}

  divedra-global-parity-validate:
    desc: Validate the global parity design-plan-implement workflow bundle
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow validate parity-global-design-plan-implement-loop

  divedra-global-parity:
    desc: Run the global parity design-plan-implement workflow from the project catalog (pass workflow args after --)
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow run parity-global-design-plan-implement-loop {{.CLI_ARGS}}

  divedra-codex-concurrent-validate:
    desc: Validate the codex-agent concurrent design-plan-implement workflow bundle
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow validate codex-agent-concurrent-design-implement-loop

  divedra-codex-concurrent:
    desc: Run the codex-agent concurrent design-plan-implement workflow from the project catalog (pass workflow args after --)
    deps:
      - checkout-divedra
    cmds:
      - nix run ./divedra -- workflow run codex-agent-concurrent-design-implement-loop {{.CLI_ARGS}}
